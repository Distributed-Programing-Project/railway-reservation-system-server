name: Java CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'initialize'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard main branch
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reject CLAUDE.md in main
        run: |
          if [ -f CLAUDE.md ]; then
            echo "CLAUDE.md must not be merged into main."
            exit 1
          fi

  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify