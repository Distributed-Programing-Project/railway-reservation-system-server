name: Java CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'initialize'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkout common
        uses: actions/checkout@v4
        with:
          repository: Distributed-Programing-Project/railway-reservation-system-common
          path: common

      - name: Install common
        run: mvn -B install -DskipTests -f common/pom.xml

      - name: Build
        run: mvn -B clean package -DskipTests